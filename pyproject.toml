[build-system]
requires = ["setuptools>=75,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "server-control-mcp"
version = "0.1.0"
description = "Self-hosted server control with persistent OAuth and directed MCP Events"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["coding-tools-mcp==0.5.0", "PyJWT==2.15.1"]

[project.scripts]
server-control-mcp = "server_control_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false
