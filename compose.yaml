# Linux host networking keeps both listeners on the host's loopback interface.
services:
  server-control:
    build: .
    init: true
    network_mode: host
    env_file: .env
    environment:
      SCM_STATE_DIR: /data/state
      SCM_WORKSPACE: /data/workspace
    volumes:
      - mcp-state:/data/state
      - mcp-workspace:/data/workspace
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  mcp-state:
  mcp-workspace:
